# ENV
env=prod

# FRONTEND
frontend.url=https://crm.cocreadores.com

# SERVER
server.port=80

# SECURITY
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.cookie.secure=true
security.jwt.cookie.name=REFRESH_TOKEN_PROD
security.jwt.cookie.domain=cocreadores.com
security.api.secret=${SECURITY_API_SECRET}

# DB
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# WEBHOOK
webhook.api.secret=${WEBHOOK_API_SECRET}

# MAKE
make.api.secret=${MAKE_API_SECRET}

# WHATSAPP
whatsapp.api.url=https://graph.facebook.com/v22.0/
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.number.token=${WHATSAPP_NUMBER_TOKEN}
whatsapp.business.token=${WHATSAPP_BUSINESS_TOKEN}
whatsapp.secret=${WHATSAPP_SECRET}
