# ENV
env=dev

# FRONTEND
frontend.url=https://localhost:8901

# SERVER
server.port=8900
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${HOME}/.cocreadores/ssl/localhost.p12
server.ssl.key-store-password=secret123
server.ssl.key-alias=localhost
server.ssl.enabled=true

# SECURITY
security.jwt.secret=DUMMYSECRET
security.jwt.cookie.secure=false
security.jwt.cookie.name=REFRESH_TOKEN_DEV
security.jwt.cookie.domain=localhost
security.api.secret=SECURITY_API_SECRET

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/cocreadores
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# WEBHOOK
webhook.api.secret=WEBHOOK_API_SECRET

# MAKE
make.api.secret=MAKE_API_SECRET

# WHATSAPP
whatsapp.api.url=https://graph.facebook.com/v22.0/
whatsapp.api.token=WHATSAPP_API_TOKEN
whatsapp.number.token=WHATSAPP_NUMBER_TOKEN
whatsapp.business.token=WHATSAPP_BUSINESS_TOKEN
whatsapp.secret=WHATSAPP_SECRET

csv.import.overwrite=false